name: gcp-prod-presidio-anonymizer

on:
  push:
    branches:
      - feature/fpe-anonymizer
  workflow_dispatch:

env:
  GCP_PROJECT_ID: trusys-prod
  GCP_REGION: us-central1
  GAR_REPOSITORY: presidio
  CLOUD_RUN_SERVICE: presidio-anonymizer

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file presidio-anonymizer/Dockerfile --build-arg NAME=presidio-anonymizer --tag "${IMAGE}" presidio-anonymizer
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --image="${IMAGE}" \
            --port=3000 --memory=2Gi --cpu=1 --timeout=300 --min-instances=0 --max-instances=10 \
            --set-env-vars=WORKERS=1 --allow-unauthenticated --quiet
